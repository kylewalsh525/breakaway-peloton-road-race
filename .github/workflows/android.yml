name: Build Android shell
on:
  push:
    paths: ['android/**', 'client/**', 'shared/**', 'scripts/build.mjs', 'scripts/prepare_android.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'client/**', 'shared/**', 'scripts/build.mjs', 'scripts/prepare_android.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare model, verify Gradle distribution, compile and unit test
        run: python3 scripts/prepare_android.py :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: breakaway-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/model-lock.json
          if-no-files-found: error
          retention-days: 14
